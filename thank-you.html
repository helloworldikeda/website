<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 | hello World 英語・プログラミング教室</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #ef0d50 0%, #c0185a 100%);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .check-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef0d50, #c0185a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #ef0d50, #c0185a);
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 1.5rem;
        }

        .home-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <header class="bg-white border-b border-gray-100 py-3.5 px-4 sticky top-0 z-50 shadow-xs">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html"
                class="flex items-center gap-1.5 text-gray-600 hover:text-gray-900 font-semibold text-sm transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>ホームへ戻る</span>
            </a>
            <a href="index.html" class="flex items-center">
                <img src="logo.svg" alt="hello world" class="h-7 sm:h-8 w-auto">
            </a>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="px-4 py-10">
        <div class="card">
            <div class="check-circle">
                <i data-lucide="check" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-900 mb-3">送信完了！ありがとうございます🎉</h1>
            <p class="text-gray-600 mb-2">お問い合わせを受け付けました。</p>
            <p class="text-gray-600">担当者より<strong>2営業日以内</strong>にご連絡いたします。</p>

            <div class="mt-6 bg-yellow-50 rounded-xl p-4 text-sm text-gray-700">
                <p class="font-bold mb-1">📌 お急ぎの方はこちら</p>
                <p><a href="tel:08022385980" class="text-red-600 font-semibold">080-2238-5980</a>（平日10:00〜20:00）</p>
                <p class="mt-1"><a href="https://line.me/ti/p/Xk4yr5s9FA" class="text-green-600 font-semibold">LINEでお問い合わせ</a>（24時間）</p>
            </div>

            <a href="index.html" class="home-btn">
                <i data-lucide="home" class="w-5 h-5"></i>
                ホームへ戻る
            </a>
        </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-5 text-sm text-gray-400">
        <p>&copy; <span id="current-year">2025</span> hello world. All rights reserved.</p>
    </footer>

    <script>
        lucide.createIcons();
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
